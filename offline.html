<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>WATHI TaskBoard</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #f6f7f9; color: #1c2430; }
      @media (prefers-color-scheme: dark) { body { background: #111827; color: #e5e7eb; } }
      main { text-align: center; max-width: 420px; padding: 32px; }
      h1 { font-size: 18px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #6b7280; font-size: 14px; line-height: 1.5; }
      button { font: inherit; font-weight: 600; color: #fff; background: #004671; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
      button:hover { background: #0b5a8a; }
      .logo { width: 56px; height: 56px; border-radius: 14px; background: #004671; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">WATHI</div>
      <h1>Connexion impossible</h1>
      <p>Le TaskBoard n’est pas joignable pour le moment. Vérifiez votre connexion internet, puis réessayez.</p>
      <button type="button" onclick="window.taskboardDesktop && window.taskboardDesktop.retry()">Réessayer</button>
    </main>
  </body>
</html>
