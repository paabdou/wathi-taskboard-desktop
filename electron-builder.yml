# Construction des installeurs (npm run build dans desktop/).
# Les installeurs sont publiés dans les Releases d'un dépôt GitHub public dédié,
# que l'app interroge pour se mettre à jour.
appId: org.wathi.taskboard
productName: WATHI TaskBoard
copyright: © WATHI
artifactName: WATHI-TaskBoard-${os}-${arch}.${ext}

afterPack: scripts/adhoc-sign.cjs

directories:
  buildResources: build
  output: dist

files:
  - main.js
  - preload.js
  - updater.js
  - offline.html
  - assets/**
  - package.json

# Schéma d'adresse wathi-taskboard:// : lien de confirmation d'e-mail ouvert dans l'app.
protocols:
  - name: WATHI TaskBoard
    schemes: [wathi-taskboard]

publish:
  provider: github
  owner: paabdou
  repo: wathi-taskboard-desktop
  releaseType: release

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  # Pas de compte Apple Developer pour l'instant : pas d'identité de signature.
  # L'app est tout de même signée « ad hoc » par le hook ci-dessous, sans quoi
  # macOS refuse ses notifications système.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [universal]

dmg:
  sign: false
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

win:
  icon: build/icon.png
  verifyUpdateCodeSignature: false
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: WATHI TaskBoard
  language: 1036
